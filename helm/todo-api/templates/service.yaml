apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-todo-api-svc
  labels:
    app: todo-api
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: todo-api
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}